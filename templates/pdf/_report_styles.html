<style>
    @page { size: A4; margin: 1.5cm; }
    body { position: relative; font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #1f2937; line-height: 1.4; }
    h1 { font-size: 18pt; margin: 0 0 4px; color: #0f172a; }
    h2 { font-size: 13pt; margin: 22px 0 8px; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    .meta { margin-bottom: 16px; color: #475569; }
    .meta p { margin: 3px 0; }
    .badge { display: inline-block; padding: 2px 8px; background: #e0f2fe; color: #0369a1; font-size: 9pt; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #cbd5e1; padding: 7px 8px; text-align: left; vertical-align: top; }
    th { background: #f1f5f9; font-weight: bold; font-size: 9pt; color: #334155; }
    td.num, th.num { text-align: right; }
    tfoot td { background: #f8fafc; font-weight: bold; }
    .summary { margin-top: 16px; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; }
    .summary-grid { width: 100%; }
    .summary-grid td { border: none; padding: 4px 12px 4px 0; }
    .summary-grid .value { font-weight: bold; color: #0f172a; text-align: right; }
    .empty { padding: 14px; text-align: center; color: #64748b; font-style: italic; }
    .note { margin: 10px 0; padding: 10px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 9pt; }
    .content { position: relative; z-index: 1; }
    /* Corner logo that appears on every page in the top-right corner */
    .corner-logo { position: fixed; top: 12px; right: 12px; width: 150px; height: 150px; z-index: 3; }
    .corner-logo img { width: 150px; height: 150px; object-fit: contain; display: block; opacity: 0.95; }
    footer { margin-top: 24px; padding-top: 8px; border-top: 1px solid #e2e8f0; font-size: 8pt; color: #94a3b8; text-align: center; }
</style>
