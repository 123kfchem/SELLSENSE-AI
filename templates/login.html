{% extends "base.html" %}
{% block content %}
<section class="card auth-card">
    <h2 class="mb-3">Business Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
        
    </form>
</section>

    
<style>
   /* =========================
   MOBILE RESPONSIVE DESIGN
   ========================= */

@media (max-width: 600px) {

    body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Main page/container */
    .container,
    .page-container,
    .login-page {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
    }

    /* Header */
    .header {
        width: 100%;
        padding: 12px 16px;
        box-sizing: border-box;
    }

    /* Login section */
    .login-section {
        width: 100%;
        padding: 35px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* Login card */
    .login-card {
        width: 100%;
        max-width: 380px;
        box-sizing: border-box;
        padding: 24px 20px;
        margin: 0 auto;
    }

    /* Form */
    .login-card form {
        width: 100%;
    }

    /* Labels */
    .login-card label {
        display: block;
        width: 100%;
        margin-bottom: 7px;
        font-size: 14px;
    }

    /* INPUTS */
    .login-card input {
        display: block;
        width: 100%;
        height: 48px;
        box-sizing: border-box;
        padding: 0 14px;
        font-size: 16px;
        border-radius: 7px;
    }

    /* Password field */
    .password-wrapper {
        width: 100%;
        position: relative;
    }

    .password-wrapper input {
        width: 100%;
        padding-right: 45px;
    }

    /* Login button */
    .login-card button,
    .login-button {
        width: 100%;
        min-height: 48px;
        font-size: 16px;
        margin-top: 15px;
        border-radius: 7px;
    }

    /* Footer */
    .footer {
        width: 100%;
        box-sizing: border-box;
        padding: 20px 16px;
        text-align: center;
    }
}
    </style>
{% endblock %}
